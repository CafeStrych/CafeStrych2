function currentMonth() {

function assigned(id, a, b) {
  return S.shifts
    .filter(
      (x) => x.employee_id === id && x.shift_date >= a && x.shift_date <= b,
    )
    .reduce((q, x) => q + hours(x), 0);
}
window.buildProposal = () => {
  let m = currentMonth(),
    first = new Date(m.getFullYear(), m.getMonth(), 1),
    last = new Date(m.getFullYear(), m.getMonth() + 1, 0),
    a = ISO(first),
    b = ISO(last),
    draft = [];
  for (let i = 1; i <= last.getDate(); i++) {
    let d = new Date(m.getFullYear(), m.getMonth(), i),
      ds = ISO(d);
    if (d.getDay() === 0) continue;
    let eligible = S.employees.filter(
      (e) =>
        !off(e.id, ds) &&
        !S.shifts.some((x) => x.employee_id === e.id && x.shift_date === ds) &&
        !draft.some((x) => x.employee_id === e.id && x.shift_date === ds),
    );
    eligible.sort(
      (x, y) =>
        (assigned(x.id, a, b) +
          draft.filter((z) => z.employee_id === x.id).length * 8) /
          ((x.weekly_target_hours || 40) * 4.348) -
        (assigned(y.id, a, b) +
          draft.filter((z) => z.employee_id === y.id).length * 8) /
          ((y.weekly_target_hours || 40) * 4.348),
    );
    if (eligible[0])
      draft.push({
        key: crypto.randomUUID(),
        employee_id: eligible[0].id,
        shift_date: ds,
        start_time: "12:00",
        end_time: "20:00",
      });
  }
  S.proposal = draft;
  renderProposal();
};

function currentEmployee() {
  const email = (S.p?.email || S.u?.email || "").toLowerCase();
  return S.employees.find(
    (e) =>
      e.user_id === S.u?.id ||
      e.profile_id === S.u?.id ||
      (e.email || "").toLowerCase() === email ||
      e.full_name === S.p?.full_name,
  );
}
function visibleShifts() {
  if (manage()) return S.shifts;
  const e = currentEmployee();
  return e ? S.shifts.filter((x) => x.employee_id === e.id) : [];
}
function monthRange(d = new Date()) {
  const a = new Date(d.getFullYear(), d.getMonth(), 1),
    b = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return [ISO(a), ISO(b)];
}
function sumHours(rows) {
  return rows.reduce((n, x) => n + Math.max(0, hours(x)), 0);
}
function hoursSummary() {
  const [a, b] = monthRange(S.mode === "month" ? S.month : S.week);
  const rows = visibleShifts().filter(
    (x) => x.shift_date >= a && x.shift_date <= b,
  );
  if (!manage())
    return `<div class="hoursHero"><span>Twoje godziny w miesiącu</span><strong>${sumHours(rows).toFixed(2).replace(".", ",")} h</strong></div>`;
  const cards = S.employees
    .map((e) => {
      const h = sumHours(rows.filter((x) => x.employee_id === e.id));
      return `<div class="hourMini"><span>${E(e.full_name)}</span><b>${h.toFixed(2).replace(".", ",")} h</b></div>`;
    })
    .join("");
  return `<details class="hoursDetails"><summary>Podsumowanie godzin pracowników</summary><div class="hourMiniGrid">${cards}</div></details>`;
}

/* ===== Cafe Strych 3.6.0 POS SYNC ===== */
(()=>{
 let previewRole=null;
 const actualRole=()=>S.p?.role||'user';
 const effectiveRole=()=>previewRole||actualRole();
 const managementView=()=>['admin','manager'].includes(effectiveRole());
 const activeNav=v=>document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
 const labelRole=r=>({admin:'Administrator',manager:'Kierownik',user:'Pracownik'}[r]||r);
 function applyPreview(){
  document.querySelectorAll('[data-role-preview]').forEach(b=>b.classList.toggle('active',b.dataset.rolePreview===effectiveRole()));
  const manage=managementView();
  document.querySelector('[data-v="pos"]')?.classList.toggle('hide',!manage&&!perm('can_pos'));
  document.querySelector('[data-v="bookings"]')?.classList.toggle('hide',!manage&&!perm('can_bookings'));
  document.querySelector('#settings')?.classList.toggle('hide',actualRole()!=='admin'&&actualRole()!=='manager');
  document.querySelector('#employees')?.classList.toggle('hide',!manage);
 }
 window.setRolePreview=r=>{previewRole=r;applyPreview();view(r==='user'?'schedule':'dashboard');toast('Widok: '+labelRole(r))};
 document.querySelectorAll('[data-role-preview]').forEach(b=>b.onclick=()=>setRolePreview(b.dataset.rolePreview));
 const baseBoot36=boot;boot=async s=>{await baseBoot36(s);if(S.u){const rp=document.querySelector('#rolePreview');rp?.classList.toggle('hide',actualRole()!=='admin');applyPreview()}};
 const oldManage=manage;manage=()=>managementView();
 const orderRows=id=>(S.orderItems||[]).filter(x=>x.order_id===id);
 const friendlyOrder=o=>{const t=(S.tables||[]).find(x=>x.id===o.table_id);return o.customer_name?.trim()||t?.label||'Na wynos'};
 const closed=o=>['paid','cancelled'].includes(o.status);
 function orderTile(o){const rows=orderRows(o.id);return `<button class="posOrderTile" onclick="openOrder('${o.id}')"><div class="posOrderHead"><div><b>${E(friendlyOrder(o))}</b><small>${E(o.order_no||'Rachunek')} • ${new Date(o.created_at).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}</small></div><strong>${money(orderTotal(o))}</strong></div><div class="posOrderLines">${rows.map(i=>`<span><span>${Number(i.qty)} × ${E(i.item_name)}</span><b>${money(Number(i.qty)*Number(i.unit_price))}</b></span>`).join('')||'<small class="muted">Brak pozycji</small>'}</div></button>`}
 renderPOS=function(){activeNav('pos');const open=(S.orders||[]).filter(o=>!closed(o));$('#content').innerHTML=`<div class="toolbar"><div><h2>🧾 Otwarte rachunki</h2><small>Aktualizowane między urządzeniami</small></div><div class="actions"><button class="ghost" onclick="renderOrderHistory()">Historia rachunków</button><button class="ghost" onclick="renderMenuAdmin()">Menu</button><button class="primary" onclick="newOrder()">+ Rachunek</button></div></div><div class="posOrderGrid">${open.map(orderTile).join('')||'<p class="muted">Brak otwartych rachunków.</p>'}</div>`};window.renderPOS=renderPOS;
 window.renderOrderHistory=()=>{activeNav('pos');const rows=(S.orders||[]).filter(closed);$('#content').innerHTML=`<div class="toolbar"><div><button class="ghost" onclick="renderPOS()">← POS</button><h2>Historia rachunków</h2></div></div><div class="posOrderGrid historyGrid">${rows.map(orderTile).join('')||'<p class="muted">Brak zamkniętych rachunków.</p>'}</div>`};
 const oldOpen36=window.openOrder;window.openOrder=id=>{activeNav('pos');oldOpen36(id)};
 RP=function(){activeNav('products');$('#content').innerHTML=`<div class="toolbar"><div><h2>🛒 Lista zakupów</h2><small>Produkty potrzebne do zamówienia</small></div><button class="primary" onclick="PF()">+ Dodaj</button></div><div class="list">${(S.products||[]).map(x=>`<div class="card"><div class="grow"><b>${E(x.title)}</b><small>${E(x.quantity||'')}</small></div><div class="actions"><button class="ghost" onclick="editProduct('${x.id}')">Edytuj</button><button class="danger" onclick="deleteProduct('${x.id}')">Usuń</button></div></div>`).join('')||'<p class="muted">Lista zakupów jest pusta.</p>'}</div>`};window.RP=RP;
 const baseView36=view;view=v=>{if(v==='products'){RP();return}baseView36(v);activeNav(v)};window.view=view;
 const baseEmployees=renderEmployees;renderEmployees=function(){baseEmployees();document.querySelectorAll('#content .card').forEach((card,i)=>{const e=S.employees[i];if(!e)return;const actions=card.querySelector('.actions');if(actions&&!actions.querySelector('.deleteEmployeeBtn'))actions.insertAdjacentHTML('beforeend',`<button class="danger deleteEmployeeBtn" onclick="event.stopPropagation();deleteEmployee('${e.id}')">Usuń</button>`)})};window.renderEmployees=renderEmployees;
 window.deleteEmployee=async id=>{const e=S.employees.find(x=>x.id===id);if(!e)return;if(!confirm(`Usunąć pracownika ${e.full_name}? Konto i powiązane dane mogą pozostać w historii.`))return;const {error}=await sb.from('employees').update({active:false}).eq('id',id);if(error)return alert(error.message);await load();renderEmployees();toast('Pracownik usunięty')};
 const baseLive=liveReload; // existing subscriptions still refresh shared Supabase data
 ['pos_orders','pos_order_items','pos_payments'].forEach(table=>sb.channel('cafe-'+table).on('postgres_changes',{event:'*',schema:'public',table},liveReload).subscribe());
 const version=document.querySelector('#appVersion');if(version)version.textContent='Wersja 3.7.0 SINGLE INDEX';
})();
